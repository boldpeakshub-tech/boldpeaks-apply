<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoldPeaks Hub - Application</title>
<style>
  :root { --ink:#0d1b2a; --gold:#f9b208; --line:#dde2e8; --graphite:#4a5565; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, Arial, sans-serif; color:var(--ink); background:#f7f8fa; }
  main { max-width:560px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-family: Georgia, serif; font-size:1.9rem; margin:0 0 6px; }
  p.sub { color:var(--graphite); margin:0 0 28px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:18px 0 6px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--gold); border-color:transparent; }
  textarea { min-height:120px; resize:vertical; }
  .hp { position:absolute; left:-9999px; height:0; overflow:hidden; }
  button { margin-top:24px; width:100%; padding:13px; border:0; border-radius:6px; background:var(--ink); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { margin-top:18px; padding:12px 14px; border-radius:6px; display:none; }
  #msg.ok { display:block; background:#e8f5ec; color:#17602d; }
  #msg.err { display:block; background:#fdecec; color:#8a1f1f; }
  .req { color:#b42318; }
</style>
</head>
<body>
<main>
  <h1>Apply to BoldPeaks Hub</h1>
  <p class="sub">Tell us a little about yourself. You'll get a confirmation email right away.</p>

  <form id="f" novalidate>
    <label for="name">Full name <span class="req">*</span></label>
    <input id="name" name="name" autocomplete="name" required />

    <label for="email">Email <span class="req">*</span></label>
    <input id="email" name="email" type="email" autocomplete="email" required />

    <label for="phone">Phone (optional)</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" />

    <label for="status">I am a</label>
    <select id="status" name="status">
      <option>Secondary school graduate</option>
      <option>University student</option>
      <option>Young professional</option>
      <option>Other</option>
    </select>

    <label for="organization">School or organization (optional)</label>
    <input id="organization" name="organization" />

    <label for="pathway">Pathway of interest <span class="req">*</span></label>
    <select id="pathway" name="pathway" required>
      <option value="">Choose one</option>
      <option>Expressive Communication</option>
      <option>AI &amp; Digital Skills Lab</option>
      <option>Project Design &amp; Community Innovation</option>
    </select>

    <label for="message">Why do you want to join? <span class="req">*</span></label>
    <textarea id="message" name="message" required></textarea>

    <!-- Spam trap: leave empty. Bots fill it, the script ignores them. -->
    <div class="hp" aria-hidden="true">
      <label>Website <input name="website" tabindex="-1" autocomplete="off" /></label>
    </div>

    <button id="btn" type="submit">Submit application</button>
    <div id="msg" role="status"></div>
  </form>
</main>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKZ4tJWAtdZ0_RYdjoFnMz0kNean0gUSTJB9LILDvqIUhKizZg8tA3L74okOHsOOvvyw/exec";
  const FALLBACK_EMAIL = "boldpeakshub@gmail.com";

  const f = document.getElementById("f");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  const show = (cls, text) => { msg.className = cls; msg.textContent = text; };

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (SCRIPT_URL.startsWith("PASTE")) return show("err", "Add your web app URL in the SCRIPT_URL line first.");
    if (!f.reportValidity()) return;

    btn.disabled = true; btn.textContent = "Sending...";
    try {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: new URLSearchParams(new FormData(f)) });
      const data = await res.json();
      if (data.ok) {
        f.reset();
        show("ok", data.emailed === false
          ? "Application received. We could not send the confirmation email, but we have your details."
          : "Thank you! Your application is in. Check your inbox for a confirmation email.");
      } else {
        show("err", data.error || "Something went wrong. Please try again.");
      }
    } catch (err) {
      // Network or CORS problem: we cannot tell whether it arrived
      show("err", "We could not confirm your submission. Please check the sheet, or email us at " + FALLBACK_EMAIL + ".");
    } finally {
      btn.disabled = false; btn.textContent = "Submit application";
    }
  });
</script>
</body>
</html>
